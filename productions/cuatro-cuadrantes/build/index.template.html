      <!-- ============ SCREEN OVERLAYS ============ -->
      <div id="ov-stop" class="ov" style="top: 250px; font-weight: 800; font-size: 64px; letter-spacing: -0.02em">¿TU NEGOCIO<br /><span style="color: #b45309">SE DETENDRÍA?</span></div>
      <div id="ov-tt" class="ov ovk" style="top: 330px; font-size: 64px">
        <span id="ov-tt1" style="opacity: 0">TU TIEMPO</span>
        <svg width="190" height="40" viewBox="0 0 190 40" style="vertical-align: middle; margin: 0 14px"><path id="ov-arr" d="M8 20 C60 14 120 26 182 20" stroke="#171717" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="180" stroke-dashoffset="180" /></svg>

      </div>
      <div id="ov-sys" class="ov ovk" style="top: 1350px; font-size: 50px; color: #0d9488"><span style="background: rgba(255,255,255,0.94); padding: 6px 26px; border-radius: 16px">EL SISTEMA SIGUE FUNCIONANDO</span></div>

      <audio id="vo" src="assets/audio/narracion.wav" data-start="0" data-duration="91.1" data-track-index="10" data-volume="1"></audio>

    <script>
      window.__timelines = window.__timelines || {};
      const DUR = {{DUR}};
      const tl = gsap.timeline({ paused: true });
      const $ = (s) => document.querySelector(s);
      const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
      const ease = (p) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(p, 0, 1));

      // ---------- camera keys (time, cx, cy, s) — eased between consecutive keys ----------
      const C = { full: [540, 960, 1], up: [540, 920, 1.02], E: [325, 805, 2.25], A: [325, 1235, 2.25], D: [755, 805, 2.25], I: [755, 1235, 2.25] };
      const camKeys = [
        [0, ...C.full], [0.4, ...C.full], [4.6, ...C.full], [5.4, ...C.up], [9.75, ...C.up], [10.5, ...C.E], [17.45, ...C.E], [18.25, ...C.A],
        [26.95, ...C.A], [27.75, ...C.D], [37.7, ...C.D], [38.45, ...C.I], [46.2, ...C.I], [47.3, ...C.full], [61.4, ...C.full], [62.6, 790, 820, 2.3],
        [66.7, 790, 820, 2.3], [68.4, 800, 795, 2.85], [69.4, 800, 795, 2.85], [70.6, ...C.full], [75.15, ...C.full], [76.3, 790, 820, 2.3],
        [81.9, 790, 820, 2.3], [82.9, ...C.full], [83.55, ...C.full], [84.35, 540, 2880, 1], [DUR, 540, 2880, 1],
      ];
      function camAt(t) {
        for (let i = 0; i < camKeys.length - 1; i++) {
          const a = camKeys[i], b = camKeys[i + 1];
          if (t <= b[0]) { const p = ease((t - a[0]) / (b[0] - a[0] || 1)); return [a[1] + (b[1] - a[1]) * p, a[2] + (b[2] - a[2]) * p, a[3] + (b[3] - a[3]) * p]; }
        }
        const z = camKeys[camKeys.length - 1]; return [z[1], z[2], z[3]];
      }

      // ---------- ops ----------
      const ops = [];
      document.querySelectorAll(".op").forEach((g) => {
        const o = { el: g, t0: +g.dataset.t0, t1: +g.dataset.t1, tx: +(g.dataset.tx || 0), ty: +(g.dataset.ty || 0), hold: g.dataset.hold === "1" };
        if (g.classList.contains("dg")) {
          o.type = "dg";
          o.paths = [...g.querySelectorAll(".ink")].map((p) => { const L = p.getTotalLength(); p.style.strokeDasharray = L + " " + (L + 2); p.style.strokeDashoffset = L; return { p, L }; });
          const tot = o.paths.reduce((s, x) => s + x.L, 0);
          const gap = o.paths.length > 1 ? Math.min(0.06, ((o.t1 - o.t0) * 0.25) / (o.paths.length - 1)) : 0;
          const drawT = o.t1 - o.t0 - gap * (o.paths.length - 1);
          let c = o.t0;
          o.paths.forEach((x) => { x.a = c; x.b = c + (drawT * x.L) / tot; c = x.b + gap; });
        } else if (g.classList.contains("dp")) {
          o.type = "dp"; o.p0 = +g.dataset.p0; o.p1 = +g.dataset.p1;
          const p = document.getElementById(g.dataset.path); o.path = p; o.L = p.getTotalLength();
          if (!p.dataset.init) { p.style.strokeDasharray = o.L + " " + (o.L + 2); p.style.strokeDashoffset = o.L; p.dataset.init = "1"; }
        } else {
          o.type = "wr";
          const id = "cp" + ops.length;
          const cp = document.createElementNS("http://www.w3.org/2000/svg", "clipPath"); cp.setAttribute("id", id);
          const r = document.createElementNS("http://www.w3.org/2000/svg", "rect"); r.setAttribute("x", -2000); r.setAttribute("y", -2000); r.setAttribute("width", 0); r.setAttribute("height", 6000);
          cp.appendChild(r); $("#defs").appendChild(cp); g.setAttribute("clip-path", "url(#" + id + ")"); o.rect = r; o.text = g.querySelector("text");
          const m = (g.getAttribute("transform") || "").match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/); if (m) { o.tx = +m[1]; o.ty = +m[2]; }
        }
        ops.push(o);
      });
      ops.sort((a, b) => a.t0 - b.t0);

      function tipOf(o, t) { // world position of the marker tip for op o at time t (clamped)
        if (o.type === "dg") {
          let cur = o.paths[0];
          for (const x of o.paths) { if (t >= x.a) cur = x; }
          const p = clamp((t - cur.a) / (cur.b - cur.a), 0, 1);
          const pt = cur.p.getPointAtLength(cur.L * p); return [o.tx + pt.x, o.ty + pt.y];
        }
        if (o.type === "dp") {
          const p = o.p0 + (o.p1 - o.p0) * clamp((t - o.t0) / (o.t1 - o.t0), 0, 1);
          const pt = o.path.getPointAtLength(o.L * p); return [o.tx + pt.x, o.ty + pt.y];
        }
        const bb = o.text.getBBox(); const p = clamp((t - o.t0) / (o.t1 - o.t0), 0, 1); const fs = +o.text.getAttribute("font-size");
        return [o.tx + bb.x + bb.width * p, o.ty + bb.y + bb.height * 0.62 + Math.sin(p * bb.width * 0.22) * fs * 0.16];
      }
      function startOf(o) { return tipOf(o, o.t0); }

      function renderOps(t) {
        for (const o of ops) {
          if (o.type === "dg") o.paths.forEach((x) => { const p = clamp((t - x.a) / (x.b - x.a), 0, 1); x.p.style.strokeDashoffset = x.L * (1 - p); });
          else if (o.type === "wr") { const bb = o.text.getBBox(); const p = clamp((t - o.t0) / (o.t1 - o.t0), 0, 1); o.rect.setAttribute("x", bb.x - 10); o.rect.setAttribute("width", p >= 1 ? 6000 : (bb.width + 20) * p); }
        }
        // partial path (two ops share one path)
        const dps = ops.filter((o) => o.type === "dp"); let prog = 0;
        for (const o of dps) { if (t >= o.t0) prog = o.p0 + (o.p1 - o.p0) * clamp((t - o.t0) / (o.t1 - o.t0), 0, 1); }
        if (dps.length) dps[0].path.style.strokeDashoffset = dps[0].L * (1 - prog);
      }

      function screenToWorld(sx, sy, cam) { return [cam[0] + (sx - 540) / cam[2], cam[1] + (sy - 960) / cam[2]]; }

      function handAt(t, cam) { // returns [x, y, lift(0..1)] in world coords, or null for offscreen rest
        const rest = screenToWorld(1250, 2250, cam);
        let prev = null, next = null;
        for (const o of ops) { if (o.t0 <= t) prev = o; else { next = o; break; } }
        if (prev && t <= prev.t1) return [...tipOf(prev, t), 0];
        const gapEnd = next ? next.t0 : Infinity;
        const prevEnd = prev ? prev.t1 : -Infinity;
        const a = prev ? tipOf(prev, prev.t1) : rest;
        if (prev && prev.hold && t < gapEnd) {
          if (next && t > gapEnd - 0.45) { const b = startOf(next); const p = ease((t - (gapEnd - 0.45)) / 0.45); return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p, Math.sin(Math.PI * p)]; }
          return [...a, 0];
        }
        const gap = gapEnd - prevEnd;
        if (gap < 1.6 && next && prev) { const b = startOf(next); const p = ease((t - prevEnd) / gap); return [a[0] + (b[0] - a[0]) * p, a[1] + (b[1] - a[1]) * p, Math.sin(Math.PI * p)]; }
        // exit after prev, enter before next
        if (prev && t < prevEnd + 0.55) { const p = ease((t - prevEnd) / 0.55); return [a[0] + (rest[0] - a[0]) * p, a[1] + (rest[1] - a[1]) * p, p]; }
        if (next && t > gapEnd - 0.55) { const b = startOf(next); const p = ease((t - (gapEnd - 0.55)) / 0.55); return [rest[0] + (b[0] - rest[0]) * p, rest[1] + (b[1] - rest[1]) * p, 1 - p]; }
        return [...rest, 1];
      }

      // ---------- gear angle: integral of a piecewise speed profile ----------
      const gearProf = [
        { el: "#gr1", dir: 1, v: 70, on: 29.85, stop: [63.9, 64.7], re: [78.6, 79.2] },
        { el: "#gr2", dir: -1, v: 93, on: 30.2, stop: [64.3, 65.2], re: [79.8, 80.4] },
        { el: "#gr3", dir: 1, v: 82, on: 30.6, stop: [64.7, 65.7], re: [80.5, 81.1] },
      ];
      function speed(g, t) {
        if (t < g.on) return 0;
        if (t < g.stop[0]) return g.v * clamp((t - g.on) / 0.5, 0, 1);
        if (t < g.stop[1]) return g.v * (1 - (t - g.stop[0]) / (g.stop[1] - g.stop[0]));
        if (t < g.re[0]) return 0;
        return g.v * clamp((t - g.re[0]) / (g.re[1] - g.re[0]), 0, 1);
      }
      function gearAngle(g, t) { let a = 0; const dt = 1 / 60; for (let x = 0; x < t; x += dt) a += speed(g, x) * Math.min(dt, t - x); return a * g.dir; }

      const handEl = $("#hand"), camEl = $("#cam"), handIn = $("#handIn"), shadow = $("#handShadow");
      function frame(t) {
        const cam = camAt(t);
        camEl.setAttribute("transform", `translate(540 960) scale(${cam[2]}) translate(${-cam[0]} ${-cam[1]})`);
        renderOps(t);
        const h = handAt(t, cam);
        const k = 1 / cam[2];
        handEl.setAttribute("transform", `translate(${h[0]} ${h[1]}) scale(${k * (1 + 0.05 * h[2])})`);
        shadow.setAttribute("transform", `translate(${16 + 22 * h[2]} ${20 + 26 * h[2]})`);
        gearProf.forEach((g) => $(g.el).setAttribute("transform", `rotate(${gearAngle(g, t)})`));
        document.querySelectorAll(".sgr").forEach((g, i) => g.setAttribute("transform", `rotate(${(i % 2 ? -1 : 1) * 40 * Math.max(0, t - 86.4)})`));
        // clocks
        const em = t < 11.0 ? 0 : (t - 11.0) * 60;
        $("#eHandM").setAttribute("transform", `translate(330 215) rotate(${em})`);
        const am = t < 23.9 ? 0 : (t - 23.9) * 45;
        $("#aHand").setAttribute("transform", `translate(165 222) rotate(${am})`);
      }
      const drv = { t: 0 };
      tl.to(drv, { t: DUR, duration: DUR, ease: "none", onUpdate: () => frame(drv.t) }, 0);
      frame(0);

      // ---------- colour accents & overlays (plain GSAP) ----------
      const on = (s, t, o = 0.08, d = 0.4) => tl.to(s, { opacity: o, duration: d, ease: "power1.out" }, t);
      on("#tE", 2.75); on("#tD", 2.8); on("#tA", 2.85); on("#tI", 2.9);
      tl.to("#LE", { fill: "#2563eb", duration: 0.3 }, 2.75); tl.to("#LD", { fill: "#0d9488", duration: 0.3 }, 2.8);
      tl.to("#LA", { fill: "#f59e0b", duration: 0.3 }, 2.85); tl.to("#LI", { fill: "#7c3aed", duration: 0.3 }, 2.9);
      tl.to(["#title1", "#title2"], { opacity: 0, duration: 0.35 }, 4.6);
      tl.to(["#title3", "#title4"], { opacity: 0, duration: 0.3 }, 9.6);
      on("#eClockFace", 7.8, 0.12); on("#eHandM line", 7.8, 1);
      on("#eDocFill", 14.45, 0.18);
      tl.to("#eArrow", { opacity: 0.25, duration: 0.4 }, 15.3); tl.to("#eDocFill", { opacity: 0.05, duration: 0.5 }, 15.3);
      on("#aAwning", 19.8, 0.6);
      tl.to(["#aC1 path", "#aC2 path", "#aC3 path", "#aC4 path"], { stroke: "#f59e0b", duration: 0.3 }, 22.5);
      on("#aHand line", 23.95, 1);
      tl.to(["#aC1 path", "#aC2 path", "#aC3 path", "#aC4 path"], { stroke: "#94a3b8", duration: 0.5 }, 24.4);
      tl.to(".aT", { opacity: 0.4, duration: 0.6 }, 24.5);
      ["#gf1", "#gf2", "#gf3"].forEach((s, i) => on(s, 30.0 + i * 0.35, 0.35));
      tl.to("#dOwner", { x: 26, opacity: 0.35, duration: 1.0, ease: "sine.inOut" }, 35.5);
      on("#iCoinFill", 41.0, 0.2);
      tl.to("#iLine", { stroke: "#7c3aed", duration: 0.4 }, 42.6);
            tl.to(["#lbL", "#lbR", "#divider"], { opacity: 0, duration: 0.4 }, 55.9);
      tl.to(["#tD", "#tA"], { opacity: 0.02, duration: 0.4 }, 58.4); tl.to(["#tE", "#tI"], { opacity: 0.16, duration: 0.4 }, 58.4);
      tl.to(["#tD", "#tA", "#tE", "#tI"], { opacity: 0.08, duration: 0.5 }, 61.0);
      tl.to(["#mt1", "#mt2", "#multi"], { opacity: 0, duration: 0.4 }, 61.25);
      // the stop: turquoise drains
      tl.to(["#gf1", "#gf2", "#gf3"], { opacity: 0.0, duration: 1.8, stagger: 0.3 }, 64.0);
      tl.to("#tD", { opacity: 0, duration: 1.5 }, 64.0);
      tl.to(".gear", { stroke: "#475569", duration: 1.5 }, 64.0);
      tl.fromTo("#ov-stop", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out", immediateRender: false }, 66.75);
      tl.to("#ov-stop", { opacity: 0, duration: 0.35 }, 69.2);
      tl.to("#ov-tt", { opacity: 1, duration: 0.01 }, 72.7);
      tl.to("#ov-tt1", { opacity: 1, duration: 0.35 }, 72.75);
      tl.to("#ov-arr", { strokeDashoffset: 95, duration: 0.5, ease: "power1.out" }, 73.25);
      tl.to("#ov-tt2", { opacity: 1, duration: 0.35 }, 73.9);
      tl.to("#ov-tt", { opacity: 0, duration: 0.4 }, 74.95);
      // rebirth
      tl.to("#sol1", { opacity: 1, duration: 0.3 }, 78.4); tl.to("#sol2", { opacity: 1, duration: 0.3 }, 79.2); tl.to("#sol3", { opacity: 1, duration: 0.3 }, 80.3);
      tl.to("#procTxt", { opacity: 1, duration: 0.3 }, 79.8);
      tl.to(".gear", { stroke: "#171717", duration: 0.6 }, 80.5);
      tl.to(["#gf1", "#gf2", "#gf3"], { opacity: 0.35, duration: 0.6, stagger: 0.15 }, 80.55);
      tl.to("#tD", { opacity: 0.1, duration: 0.6 }, 80.55);
      tl.fromTo("#ov-sys", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, 81.2);
      tl.to(["#ov-sys", "#ov-sol"], { opacity: 0, duration: 0.35 }, 82.0);
      tl.fromTo("#ov-q1", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, 82.15);
      tl.fromTo("#ov-q2", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, immediateRender: false }, 82.75);
      tl.to(["#ov-q1", "#ov-q2"], { opacity: 0, duration: 0.3 }, 83.45);
      tl.fromTo("#ov-com", { opacity: 0 }, { opacity: 1, duration: 0.4, immediateRender: false }, 84.15);
      tl.to("#sg", { opacity: 1, duration: 0.8 }, 86.4);
      tl.fromTo("#ov-tag", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.5, immediateRender: false }, 87.0);
      tl.fromTo("#ov-logo", { opacity: 0 }, { opacity: 1, duration: 0.6, immediateRender: false }, 87.6);

      window.__timelines["main"] = tl;
    </script>
